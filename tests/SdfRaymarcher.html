<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
#log { position: fixed; left: 16px; bottom: 16px; margin: 0; color: #f66; font: 14px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<pre id="log"></pre>
<script>
const log = (text) => { document.getElementById("log").textContent += text + "\n"; };
if (!navigator.gpu)
    log("This browser has no WebGPU.");
if (!crossOriginIsolated)
    log("This page is not cross-origin isolated, so threads are not available.");
addEventListener("error", (event) => log(String(event.message)));
addEventListener("unhandledrejection", (event) => log(String(event.reason)));
var Module = { printErr: log, onAbort: (reason) => log("abort: " + reason) };
</script>
